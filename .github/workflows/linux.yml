name: Linux app
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: node scripts/package-linux.cjs
      - name: Install Linux package with sandbox permissions
        run: sudo apt-get install -y ./release-linux/Ember-Linux-x64.deb
      - name: Verify actual Linux editor
        run: xvfb-run -a node scripts/verify-linux-ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-qa
          path: .openai/verification/mac/
      - name: Publish Linux archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view desktop-v1.22.5 >/dev/null 2>&1 || gh release create desktop-v1.22.5 --title 'Ember desktop 1.22.5' --notes 'Mesh creator update. Linux: install the DEB on Ubuntu 24.04 or compatible. Native Niagara and Blender conversion require Windows.' --latest=false
          gh release upload desktop-v1.22.5 release-linux/*.deb release-linux/*.tar.gz release-linux/*.sha256 --clobber
